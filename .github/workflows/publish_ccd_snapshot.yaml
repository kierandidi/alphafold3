name: Publish CCD snapshot

# The wheel used to carry share/libcifpp/components.cif, which libcifpp's CMake
# downloads from wwPDB at build time with no hash check. That made the wheel
# 132 MB (114 MB of it this one file) and silently tied every build's chemistry
# tables to whatever wwPDB happened to be serving that day.
#
# Publish an immutable, hash-verified snapshot instead, so `build_data` can
# fetch one known CCD rather than whatever is current. Run this only when the
# project intends to move to a newer CCD; pinning is the point.

on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: >-
          SHA-256 of the DECOMPRESSED components.cif to accept. Leave empty to
          publish whatever wwPDB currently serves (and print its hash).
        required: false
        default: "55a4a3833536556fad7d5e425dd08b8bae12142b3a3f57bfea17cc1546ab374c"
      tag:
        description: "Tag to publish under, e.g. ccd-20261031"
        required: true
        default: "ccd-20261031"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the CCD from wwPDB
        run: |
          set -euo pipefail
          curl -sSL --retry 3 --max-time 1800 \
            https://files.wwpdb.org/pub/pdb/data/monomers/components.cif.gz \
            -o components.cif.gz
          gunzip -kc components.cif.gz > components.cif
          ACTUAL=$(sha256sum components.cif | cut -d' ' -f1)
          echo "decompressed sha256: $ACTUAL"
          echo "gz   size: $(stat -c%s components.cif.gz) bytes"
          echo "raw  size: $(stat -c%s components.cif) bytes"
          EXPECTED="${{ inputs.expected_sha256 }}"
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::wwPDB is serving a different CCD than expected."
            echo "  expected $EXPECTED"
            echo "  actual   $ACTUAL"
            echo "Publishing it would change the chemistry tables. Refusing."
            exit 1
          fi
          echo "$ACTUAL  components.cif" > components.cif.sha256

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 components.cif.sha256)
          FETCHED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Built line by line into a file rather than passed as one long
          # --notes argument: a multi-line string here has to stay indented
          # inside this block scalar, and prose that wraps to column 0 makes
          # the whole workflow unparseable -- which is how this file sat
          # registered but untriggerable.
          {
            echo "Immutable snapshot of the wwPDB Chemical Component Dictionary,"
            echo "fetched ${FETCHED}."
            echo
            echo 'Downloaded by `build_data` instead of being bundled in the wheel.'
            echo 'That keeps the wheel under the size PyPI allows, and pins the'
            echo 'chemistry tables to one known file rather than to whatever wwPDB'
            echo 'was serving on the day a given artifact was built.'
            echo
            echo 'Decompressed `components.cif` SHA-256:'
            echo
            echo '```'
            echo "${SHA}"
            echo '```'
            echo
            echo 'Source: https://files.wwpdb.org/pub/pdb/data/monomers/components.cif.gz'
          } > notes.md
          gh release create "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "CCD snapshot ${{ inputs.tag }}" \
            --notes-file notes.md \
            components.cif.gz components.cif.sha256
